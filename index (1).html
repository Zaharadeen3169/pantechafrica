<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pan Tech Africa</title>
<meta name="theme-color" content="#1E1536">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Pi SDK: loaded async so a failure here can never blank the page -->
<script src="https://sdk.minepi.com/pi-sdk.js" async></script>
<style>
:root{
  --ink:#1E1536; --ink2:#4A4163; --muted:#7B7494;
  --paper:#F7F5FB; --card:#FFFFFF; --line:#E4DFF0;
  --purple:#6B3FA0; --purple-d:#4F2C7B; --gold:#F2B233; --gold-d:#C98E10;
  --good:#1F8A5B; --bad:#C0392B;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;padding-top:var(--safe-t);padding-bottom:calc(var(--safe-b) + 90px);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:var(--safe-t);z-index:20;background:var(--ink);color:#fff}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo .pi{width:32px;height:32px;border-radius:10px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:800}
.logo small{display:block;font-size:10px;font-weight:600;color:#BDB3D8;letter-spacing:.02em;margin-top:-3px}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:0;background:#2E2350;color:#fff;font-size:14px}
.search input::placeholder{color:#A99FCB}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#A99FCB}
.user{font-size:12px;color:#BDB3D8;white-space:nowrap}

@media(max-width:560px){.bar{flex-wrap:wrap}.search{order:3;flex:1 1 100%}}
/* Hero */
.hero{background:var(--ink);color:#fff;padding:4px 0 26px}
.hero h1{font-size:clamp(26px,6vw,42px);line-height:1.1;letter-spacing:-.02em;font-weight:800;max-width:15em}
.hero p{color:#CFC6E8;margin-top:10px;font-size:14px;max-width:34em}
.hero .price-tag{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px}

/* Filters */
.filters{padding:16px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}
.tools{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tools select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px}
.range{display:flex;align-items:center;gap:10px;flex:1;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.range input{flex:1;accent-color:var(--purple)}
.range b{min-width:84px;text-align:right;color:var(--purple-d)}
.count{font-size:13px;color:var(--muted);margin:12px 0}

/* Grid and cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .img{display:block;width:100%;aspect-ratio:1/1;background:#EEE9F8}
.card .img svg{width:100%;height:100%;display:block}
.card .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.brand{font-size:11px;color:var(--muted);font-weight:600}
.card h3{font-size:14px;line-height:1.25;font-weight:700}
.price{font-weight:800;font-size:18px;color:var(--purple-d)}
.price i{font-style:normal;color:var(--gold-d);margin-right:2px}
.specs{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:11.5px;color:var(--ink2);margin-top:2px}
.specs li{display:flex;flex-direction:column;line-height:1.25}
.specs span{font-size:10px;color:var(--muted)}
.cmp{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;font-size:12px;font-weight:600;color:var(--ink2)}
.cmp input{width:18px;height:18px;accent-color:var(--purple)}
.badge{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--ink);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.empty{text-align:center;padding:50px 16px;color:var(--ink2)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;font-weight:700;font-size:15px}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:active{background:var(--gold-d)}
.btn-purple{background:var(--purple);color:#fff}
.btn-line{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.6}

/* Detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--purple-d);padding:16px 0 10px}
.detail{display:grid;gap:22px;padding-bottom:20px}
@media(min-width:800px){.detail{grid-template-columns:1fr 1fr;align-items:start}}
.gallery .main{background:#EEE9F8;border-radius:var(--r);overflow:hidden;aspect-ratio:1/1;border:1px solid var(--line)}
.gallery .main svg{width:100%;height:100%;display:block}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs button{width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#EEE9F8}
.thumbs button[aria-current=true]{border-color:var(--purple)}
.thumbs svg{width:100%;height:100%;display:block}
.info h1{font-size:clamp(22px,4.5vw,30px);line-height:1.15;letter-spacing:-.015em;font-weight:800;margin:4px 0 10px}
.info .price{font-size:30px}
.info .desc{color:var(--ink2);font-size:14px;margin:12px 0 18px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn-gold{flex:1;min-width:160px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.table th,.table td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child th,.table tr:last-child td{border-bottom:0}
.table th{width:38%;font-weight:600;color:var(--muted);font-size:13px;background:#FBFAFE}
h2.sec{font-size:18px;margin:26px 0 4px;letter-spacing:-.01em}

/* Compare */
.scroll-x{overflow-x:auto;border-radius:var(--r);margin-top:14px}
.ctable{border-collapse:separate;border-spacing:0;min-width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font-size:13.5px}
.ctable th,.ctable td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;min-width:140px;vertical-align:top}
.ctable th:first-child{position:sticky;left:0;background:#FBFAFE;color:var(--muted);font-weight:600;font-size:12.5px;min-width:112px;z-index:1;border-right:1px solid var(--line)}
.ctable thead td{background:var(--card)}
.ctable thead .pimg{width:90px;height:90px;border-radius:12px;overflow:hidden;background:#EEE9F8;margin-bottom:8px}
.ctable thead .pimg svg{width:100%;height:100%;display:block}
.ctable thead b{display:block;font-size:13.5px;line-height:1.25}
.ctable thead a{font-size:12px;color:var(--purple);font-weight:600;display:inline-block;margin-top:4px}
.best{background:#EAF7F0;color:var(--good);font-weight:700}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.legend span{background:#EAF7F0;color:var(--good);font-weight:700;padding:1px 8px;border-radius:6px}
.meter{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--purple)}

/* Compare tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#fff;padding:12px 16px calc(12px + var(--safe-b));display:none;box-shadow:0 -6px 24px rgba(30,21,54,.25)}
.tray.show{display:block}
.tray .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.tray .sel{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tray .sel span{flex:none;background:#2E2350;border-radius:999px;padding:6px 6px 6px 12px;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:170px}
.tray .sel span em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.tray .sel button{width:20px;height:20px;border-radius:50%;background:#4A3E75;font-size:12px;line-height:20px;text-align:center;flex:none}
.tray .btn{padding:10px 16px;font-size:14px}

/* Support chat */
.fab{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:40;background:var(--purple);color:#fff;border-radius:999px;padding:13px 18px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(79,44,123,.4)}
body.tray-on .fab{bottom:calc(86px + var(--safe-b))}
.chat{position:fixed;z-index:50;right:0;bottom:0;width:100%;height:78vh;max-height:620px;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(30,21,54,.3);display:none;flex-direction:column;overflow:hidden}
@media(min-width:600px){.chat{right:16px;bottom:16px;width:380px;border-radius:20px}}
.chat.open{display:flex}
.chat header{position:static;padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--ink)}
.chat header b{font-size:15px}
.chat header small{display:block;font-size:11px;color:#BDB3D8;font-weight:400}
.chat header .dot{width:9px;height:9px;border-radius:50%;background:#3DDC97}
.chat header button{margin-left:auto;font-size:22px;line-height:1;color:#fff;padding:2px 8px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.m{max-width:84%;padding:10px 13px;border-radius:14px;font-size:13.5px;white-space:pre-wrap}
.m.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:var(--purple);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0;background:var(--paper)}
.quick button{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--purple-d);font-weight:600}
.cform{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--card);padding-bottom:calc(12px + var(--safe-b))}
.cform input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.cform button{background:var(--gold);color:var(--ink);font-weight:700;padding:0 16px;border-radius:10px}
.human{display:block;text-align:center;font-size:12px;padding:8px;color:var(--purple);font-weight:600;background:var(--paper)}

/* Toast and modal */
.toast{position:fixed;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(30,21,54,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:18px;padding:24px;max-width:380px;width:100%;text-align:center}
.modal h3{font-size:19px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--ink2);margin-bottom:18px}
footer{margin-top:40px;padding:24px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}


.card .img img,.gallery .main img,.thumbs img,.ctable .pimg img{width:100%;height:100%;display:block;object-fit:contain;background:#fff}
.card .img,.gallery .main{background:#fff}
/* Professional refinements */
.hero{padding:10px 0 30px;background:linear-gradient(180deg,#1E1536 0%,#2A1D4D 100%)}
.hero h1{font-weight:700;letter-spacing:-.025em}
.hero .price-tag{background:transparent;border:1px solid #5A4A8A;color:#F2D58A;font-weight:600}
.trust{background:var(--card);border-bottom:1px solid var(--line)}
.trust-in{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding-top:14px;padding-bottom:14px}
@media(min-width:800px){.trust-in{grid-template-columns:repeat(4,1fr)}}
.trust-in div{font-size:12px;color:var(--muted);line-height:1.35;border-left:3px solid var(--gold);padding-left:10px}
.trust-in b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.card{border-radius:12px;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:#CFC5E6;box-shadow:0 8px 24px rgba(30,21,54,.09)}
.card .img{border-bottom:1px solid var(--line)}
.price{letter-spacing:-.01em}
.card .price{font-size:16px}
.badge{background:var(--ink);color:#fff;font-weight:600}
.btn{border-radius:10px;font-weight:600}
.btn-gold{box-shadow:0 1px 0 rgba(0,0,0,.08)}
footer{line-height:1.8;color:var(--muted)}
footer b{color:var(--ink);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="modal" id="modal"><div class="box">

</div></div>

/* Real product photos: images/<product-id>-1.jpg, -2.jpg, -3.jpg (or set images:[...] on a product).
   The app also tries .png and .webp for the same name. If no photo is found, the built-in
   illustration is shown instead, so nothing ever looks broken. */
var IMG_EXTS = [".jpg",".png",".webp"];
function pic(p, view){
  var custom = p.images && p.images[view];
  var base = CONFIG.IMAGE_FOLDER + p.id + "-" + (view+1);
  var src = custom || (base + IMG_EXTS[0]);
  return '<img src="'+esc(src)+'" alt="'+esc(p.name)+'" decoding="async" data-pid="'+p.id+'" data-v="'+view+'" data-x="0"'+(custom?'':' data-base="'+esc(base)+'"')+'>';
}
/* error events do not bubble, so listen in the capture phase (works even where inline handlers are blocked) */
document.addEventListener("error", function(e){
  var el = e.target;
  if(!el || el.tagName !== "IMG" || !el.getAttribute("data-pid")) return;
  var p = byId(el.getAttribute("data-pid")); if(!p) return;
  var v = +el.getAttribute("data-v"), base = el.getAttribute("data-base"), i = +el.getAttribute("data-x") + 1;
  if(base && i < IMG_EXTS.length){ el.setAttribute("data-x", i); el.src = base + IMG_EXTS[i]; return; }
  console.warn("Photo not found for", p.id, "view", v+1, "- showing illustration. Expected:", base ? base + ".jpg" : (p.images||[])[v]);
  el.outerHTML = art(p, v);
}, true);

function fmt(n){var t=Number(n).toFixed(5).replace(/0+$/,'');var d=t.split('.')[1]||'';while(d.length<4)d+='0';return '0.'+d;}

var piReady = false;
function initPi(){

  }catch(e){ console.warn("Pi init failed", e); }
}

function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},3200)}

function serverPost(path, body){
  if(!CONFIG.API_BASE) return Promise.reject(new Error("No backend configured"));
  return fetch(CONFIG.API_BASE+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){
    if(!r.ok) throw new Error("Server error "+r.status); return r.json();
  });
}
function onIncomplete(payment){
  /* A payment that did not finish earlier. Ask your backend to complete it. */
  try{ var txid = payment.transaction && payment.transaction.txid;
    serverPost("/payments/complete",{paymentId:payment.identifier, txid:txid}).catch(function(){});
  }catch(e){}
}
function buyNow(p){
  if(!window.Pi){ modal("Open in Pi Browser","Payments with Pi work inside Pi Browser. Open this app from the Pi Browser to buy "+p.name+"."); return; }
  initPi();
  var btn=$("#buyBtn"); if(btn){btn.disabled=true;btn.textContent="Opening Pi payment..."}
  var reset=function(){ if(btn){btn.disabled=false;btn.innerHTML="Buy now for "+pi(p.price)} };
  Pi.authenticate(["username","payments"], onIncomplete).then(function(auth){
    state.user = auth.user;
    Pi.createPayment({
      amount: p.price,
      memo: "Pan Tech Africa: "+p.name,
      metadata: {productId:p.id}
    },{
      onReadyForServerApproval:function(paymentId){
        serverPost("/payments/approve",{paymentId:paymentId, productId:p.id}).catch(function(e){ toast("Could not reach the server to approve this payment."); });
      },
      onReadyForServerCompletion:function(paymentId, txid){
        serverPost("/payments/complete",{paymentId:paymentId, txid:txid, productId:p.id}).then(function(){
          reset(); modal("Payment received","Thank you, "+(auth.user.username||"friend")+". Your order for "+p.name+" is confirmed. Support will contact you about delivery.");
        }).catch(function(){ reset(); toast("Payment sent, but confirmation failed. Contact support with your payment ID."); });
      },
      onCancel:function(){ reset(); toast("Payment cancelled."); },
      onError:function(err){ reset(); console.error(err); toast("Payment failed. Please try again."); }
    });
  }).catch(function(err){ reset(); console.error(err); toast("Sign in with Pi to continue."); });
}

/* ============ CATALOG ============ */
function filtered(){
  var q=state.q.trim().toLowerCase();
  var list=PRODUCTS.filter(function(p){
    if(state.cat!=="All" && p.type!==state.cat) return false;
    if(state.brand!=="All" && p.brand!==state.brand) return false;
    if(p.price>state.max+1e-9) return false;
    if(q){
      var hay=(p.name+" "+p.brand+" "+p.type+" "+TYPE_PLURAL[p.type]+" "+p.cpu).toLowerCase();
      return q.split(/\s+/).every(function(w){return hay.indexOf(w)>-1});
    }
    return true;
  });
  var s=state.sort;
  if(s==="low") list.sort(function(a,b){return a.price-b.price});
  if(s==="high") list.sort(function(a,b){return b.price-a.price});
  if(s==="perf") list.sort(function(a,b){return b.perf-a.perf});
  return list;
}

  function best(vals,mode){ /* returns index set of best values */
    var t=mode==="min"?Math.min.apply(null,vals):Math.max.apply(null,vals);

  }
  var num=function(s){var m=String(s).match(/[\d.]+/);return m?parseFloat(m[0]):0};
  var rowsDef=[
    {l:"Price",f:function(p){return pi(p.price)},v:function(p){return p.price},m:"min"},
    {l:"Performance",f:function(p){return '<b>'+p.perf+'/100</b><div class="meter"><i style="width:'+p.perf+'%"></i></div>'},v:function(p){return p.perf},m:"max"},
    {l:"Battery",f:function(p){return esc(p.battery)},v:null},
    {l:"Battery life",f:function(p){return p.hrs?(p.hrs>=100?Math.round(p.hrs/24)+" days":p.hrs+" hrs"):"n/a"},v:function(p){return p.hrs},m:"max",skip:function(){return list.some(function(p){return p.hrs>=100})&&true}},
    {l:"Storage",f:function(p){return esc(p.storage)},v:function(p){return /TB/i.test(p.storage)?num(p.storage)*1024:num(p.storage)},m:"max"},
    {l:"RAM",f:function(p){return esc(p.ram)},v:function(p){return num(p.ram)},m:"max"},
    {l:"Processor",f:function(p){return esc(p.cpu)},v:null},
    {l:"Display",f:function(p){return esc(p.screen)},v:null},
    {l:"Camera",f:function(p){return esc(p.cam)},v:null},
    {l:"Weight",f:function(p){return esc(p.weight)},v:null},
    {l:"Operating system",f:function(p){return esc(p.os)},v:null}
  ];
  var head='<tr><th></th>'+list.map(function(p){return '<td><div class="pimg">'+pic(p,0)+'</div><b>'+esc(p.name)+'</b><a href="#/p/'+p.id+'">View details</a></td>'}).join("")+'</tr>';
  var body=rowsDef.map(function(r){
    var flags=r.v?best(list.map(r.v),r.m):list.map(function(){return false});
    if(r.l==="Battery life" && list.some(function(p){return p.hrs>=100})) flags=list.map(function(){return false});
    return '<tr><th>'+r.l+'</th>'+list.map(function(p,i){return '<td class="'+(flags[i]?'best':'')+'">'+r.f(p)+'</td>'}).join("")+'</tr>';
  }).join("");
  app.innerHTML='<div class="wrap"><a class="back" href="#/">&larr; All products</a><h2 class="sec" style="margin-top:4px">Compare devices</h2>'+
   '<div class="scroll-x"><table class="ctable"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
   '<p class="legend"><span>Green</span> marks the best value in each row. Compare devices of the same type for the fairest result.</p>'+
   '<div style="margin-top:16px"><button class="btn btn-line" id="clrCmp">Clear comparison</button></div></div>';
  $("#clrCmp").onclick=function(){state.cmp=[];drawTray();location.hash="#/"};
  window.scrollTo(0,0);
}

/* ============ ROUTER ============ */
function route(){
  var h=location.hash||"#/";
  try{
    if(h.indexOf("#/p/")===0) renderDetail(h.slice(4));
    else if(h==="#/compare") renderCompare();
    else renderHome();
  }catch(e){
    console.error(e);
    app.innerHTML='<div class="wrap"><div class="empty"><b>Something went wrong</b>Reload the app to try again.</div></div>';
  }
  drawTray();
}
window.addEventListener("hashchange",route);

/* ============ EVENTS ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-cat]");
  if(t){state.cat=t.dataset.cat;renderHome();return}
  var r=e.target.closest("[data-rm]");
  if(r){toggleCmp(r.dataset.rm);if(location.hash==="#/compare")renderCompare();else if(location.hash==="#/"||!location.hash)drawGrid();return}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("[data-cmp]")){ if(!toggleCmp(t.dataset.cmp)) t.checked=false; return }
  if(t.id==="fBrand"){state.brand=t.value;drawGrid()}
  if(t.id==="fSort"){state.sort=t.value;drawGrid()}
});
document.addEventListener("input",function(e){
  if(e.target.id==="fMax"){state.max=+e.target.value;$("#fMaxV").innerHTML="&pi;"+fmt(state.max);drawGrid()}
});
$("#q").addEventListener("input",function(e){
  state.q=e.target.value;
  if(location.hash && location.hash!=="#/"){location.hash="#/";return}
  if(!$("#grid")) renderHome(); else drawGrid();
});
$("#trayGo").onclick=function(){ if(state.cmp.length>=2) location.hash="#/compare" };

/* ============ SUPPORT CHAT ============ */
var KB=[
  {k:/pay|pi |π|wallet|checkout/i,a:"You pay with Pi inside Pi Browser. Tap Buy now on a product, sign in with Pi, and approve the payment in your wallet. The price shown is the exact amount in Pi."},
  {k:/deliver|ship|arriv|when/i,a:"After your payment is confirmed, our team contacts you to arrange delivery. Delivery time depends on your city. Tell us where you are and we will give an estimate."},
  {k:/warrant|guarantee|repair|fault|broken/i,a:"Devices come with the manufacturer warranty. If something is wrong, send us your order details and a short description of the problem."},
  {k:/return|refund|cancel/i,a:"If a device arrives faulty or not as described, contact us within 7 days with your payment ID and we will arrange a replacement or refund."},
  {k:/compare|difference|better|which/i,a:"Tick Add to compare on two to four products, then tap Compare at the bottom of the screen. Tell me which devices you are choosing between and I can point out the main differences."},
  {k:/price|cheap|budget|afford/i,a:"Use the price slider and the Sort menu on the home page to see devices that fit your budget. The Best value badge marks good deals."},
  {k:/hello|hi\b|hey|good (morning|afternoon|evening)/i,a:"Hello! How can we help you today?"},
  {k:/thank/i,a:"You are welcome. Anything else we can help with?"}
];
var chatOpen=false, greeted=false;
function addMsg(text,who){var d=document.createElement("div");d.className="m "+who;d.textContent=text;var m=$("#msgs");m.appendChild(d);m.scrollTop=m.scrollHeight}
function botReply(text){
  var hit=KB.filter(function(x){return x.k.test(text)})[0];
  var ans=hit?hit.a:"Thanks for your message. A support agent will follow up. You can also use the button below to reach a person directly.";
  setTimeout(function(){addMsg(ans,"bot")},600);
}
function sendChat(text){ text=text.trim(); if(!text) return; addMsg(text,"me"); botReply(text); }
function openChat(){
  chatOpen=true; $("#chat").classList.add("open"); $("#fab").style.display="none";
  if(!greeted){ greeted=true; addMsg("Hi, welcome to Pan Tech Africa. Ask about payments, delivery, warranty or choosing a device.","bot"); }
  $("#cin").focus();
}
function closeChat(){chatOpen=false;$("#chat").classList.remove("open");$("#fab").style.display="flex"}
$("#fab").onclick=openChat; $("#chatClose").onclick=closeChat;
$("#cform").addEventListener("submit",function(e){e.preventDefault();var i=$("#cin");sendChat(i.value);i.value=""});
$("#quick").innerHTML=["How do I pay with Pi?","Delivery time","Warranty"].map(function(t){return '<button type="button">'+t+'</button>'}).join("");
$("#quick").onclick=function(e){if(e.target.tagName==="BUTTON")sendChat(e.target.textContent)};
(function(){
  var h=$("#human");
  if(CONFIG.SUPPORT_WHATSAPP) h.href="https://wa.me/"+CONFIG.SUPPORT_WHATSAPP;
  else if(CONFIG.SUPPORT_EMAIL) { h.href="mailto:"+CONFIG.SUPPORT_EMAIL; h.textContent="Email support"; h.removeAttribute("target"); }
  else h.style.display="none";
})();

route();
</script>
</body>
</html>
